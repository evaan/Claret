info:
  contact: {}
paths:
  /claret.ics:
    get:
      consumes:
      - application/json
      description: Returns an iCal file containing all schedule items for selected
        courses
      parameters:
      - description: Semester ID (i.e. 202401)
        in: query
        name: semester
        required: true
        type: string
      - description: Course Registration Numbers seperated by commas (i.e. 40983,40984)
        in: query
        name: crn
        required: true
        type: string
      produces:
      - text/calendar
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get iCal Calendar
  /courses:
    get:
      consumes:
      - application/json
      description: Returns all courses for a specified semester
      parameters:
      - description: Semester ID (i.e. 202401)
        in: query
        name: semester
        required: true
        type: string
      - description: Course ID (i.e. ECE 3400)
        in: query
        name: id
        type: string
      - description: Course Registration Number (i.e. 40983)
        in: query
        name: crn
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/util.CourseAPI'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get all courses
  /exams:
    get:
      consumes:
      - application/json
      description: Returns all exams for a specified semester
      parameters:
      - description: Semester ID (i.e. 202401)
        in: query
        name: semester
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/util.ExamTimeAPI'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get all exams
  /frontend:
    get:
      description: Returns courses, subjects, meetings, professor ratings, and timestamped
        seat snapshots. Seat snapshots fall back to PostgreSQL when the live cache
        is unavailable.
      parameters:
      - description: Semester ID (defaults to the latest semester)
        in: query
        name: semester
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.FrontendAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get schedule builder data
      tags:
      - Frontend
  /instructors:
    get:
      consumes:
      - application/json
      description: Returns all instructors and instructor ratings from a course
      parameters:
      - description: Semester ID (i.e. 202401)
        in: query
        name: semester
        required: true
        type: string
      - description: Course Registration Number (i.e. 40983)
        in: query
        name: crn
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/util.ProfessorRatingAPI'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get Course Instructors
  /rmp:
    get:
      consumes:
      - application/json
      description: Returns all instructor ratings
      parameters:
      - description: Instructor Name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/util.ProfessorRatingAPI'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get Course Instructors
  /schedule:
    get:
      description: Returns courses and meetings for the requested CRNs, without catalog
        subjects, seat counts, or ratings. An empty CRN list returns empty arrays.
      parameters:
      - description: Semester ID
        in: query
        name: semester
        required: true
        type: integer
      - description: Comma-separated CRNs (up to 100)
        in: query
        name: crns
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ScheduleAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get schedule-only data
  /semester:
    get:
      consumes:
      - application/json
      description: Returns all semesters
      parameters:
      - description: Semester ID (i.e. 202401)
        in: query
        name: semester
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/util.Semester'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get Semesters
  /subjects:
    get:
      consumes:
      - application/json
      description: Returns all subjects
      parameters:
      - description: Semester ID (i.e. 202401)
        in: query
        name: semester
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/util.Subject'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get Subjects
  /times:
    get:
      consumes:
      - application/json
      description: Returns all times from course
      parameters:
      - description: Semester ID (i.e. 202401)
        in: query
        name: semester
        required: true
        type: string
      - description: Course Registration Number (i.e. 40983)
        in: query
        name: crn
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/util.CourseTimeAPI'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get Course Times
swagger: "2.0"
